<script>
// הפלטות מוגדרות ב-design-system.css (:root[data-palette=...]) - כאן רק
// הצבעים לתצוגת העיגולים (primary/accent של מצב בהיר) ושמות בעברית.
const PALETTES = [
  { id: '',          name: 'אריג',     c1: '#7C2E4D', c2: '#96661F' },
  { id: 'forest',    name: 'יער',      c1: '#2E5C40', c2: '#9C5423' },
  { id: 'ocean',     name: 'אוקיינוס', c1: '#1F5C66', c2: '#8A661F' },
  { id: 'plum',      name: 'שזיף',     c1: '#5B3A73', c2: '#3F6E6E' },
  { id: 'amber',     name: 'ענבר',     c1: '#A85A1E', c2: '#2E6B6B' },
  { id: 'slate',     name: 'צפחה',     c1: '#3E5266', c2: '#A8622E' },
  { id: 'rose',      name: 'ורד',      c1: '#A03A54', c2: '#6E7A3A' },
  { id: 'indigo',    name: 'אינדיגו',  c1: '#3E4E8C', c2: '#B8862E' },
  { id: 'turquoise', name: 'טורקיז',   c1: '#1E7A7A', c2: '#B85A42' },
  { id: 'mustard',   name: 'חרדל',     c1: '#8C7A1E', c2: '#6E3A5C' },
  { id: 'fuchsia',   name: 'פוקסיה',   c1: '#A02E8C', c2: '#2E7A5C' },
  { id: 'coffee',    name: 'קפה',      c1: '#6B4A2E', c2: '#2E6B7A' },
  { id: 'mint',      name: 'מנטה',     c1: '#2E7A5C', c2: '#B8622E' },
  { id: 'burgundy',  name: 'בורדו',    c1: '#5C1E28', c2: '#8C6E1E' },
];

function renderPalettes() {
  const row = document.getElementById('paletteRow');
  const current = window.ShellPrefs.get().palette;
  row.innerHTML = '';
  PALETTES.forEach((p) => {
    const wrap = document.createElement('div');
    wrap.className = 'palette-opt';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch-btn' + (current === p.id ? ' active' : '');
    btn.title = p.name;
    btn.style.background = `linear-gradient(135deg, ${p.c1} 50%, ${p.c2} 50%)`;
    btn.addEventListener('click', () => {
      window.ShellPrefs.setPalette(p.id);
      renderPalettes();
    });
    const label = document.createElement('div');
    label.className = 'swatch-name';
    label.textContent = p.name;
    wrap.appendChild(btn);
    wrap.appendChild(label);
    row.appendChild(wrap);
  });
}

function renderModes() {
  const current = window.ShellPrefs.get().theme;
  document.querySelectorAll('.mode-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === current));
}

function renderDensity() {
  const current = window.ShellPrefs.get().density;
  document.querySelectorAll('.density-btn').forEach((b) => b.classList.toggle('active', b.dataset.density === current));
}

document.querySelectorAll('.mode-btn').forEach((b) => b.addEventListener('click', () => {
  window.ShellPrefs.setTheme(b.dataset.mode);
  renderModes();
}));
document.querySelectorAll('.density-btn').forEach((b) => b.addEventListener('click', () => {
  window.ShellPrefs.setDensity(b.dataset.density);
  renderDensity();
}));

renderPalettes();
renderModes();
renderDensity();
</script>

</body>
